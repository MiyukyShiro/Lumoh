name: Lumo für den Play Store bauen (AAB)

on:
  workflow_dispatch:
    inputs:
      versionName:
        description: 'Versionsname, z. B. 1.11.0'
        required: true
        default: '1.11.0'
      versionCode:
        description: 'Versionsnummer (muss bei jedem Upload steigen)'
        required: true
        default: '11'

jobs:
  bundle:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - uses: actions/setup-java@v4
        with: {distribution: 'temurin', java-version: '21'}

      - name: Umgebung prüfen
        run: |
          test -f docs/index.html || { echo "docs/index.html fehlt"; exit 1; }
          test -d android-res || { echo "android-res fehlt"; exit 1; }
          node -v && java -version

      - name: Capacitor installieren
        run: npm install --no-audit --no-fund @capacitor/core@7 @capacitor/cli@7 @capacitor/android@7 @capacitor/local-notifications@7

      - name: Android-Projekt erzeugen
        run: npx cap add android

      - name: Schlüssel entpacken
        env:
          KEYSTORE_BASE64: ${{ secrets.LUMO_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > android/app/lumo-upload.keystore
            echo "Schlüssel eingerichtet"
          else
            echo "Kein Schlüssel hinterlegt – es wird unsigniert gebaut."
          fi

      - name: Icons, Rechte, Version, Signatur
        env:
          LUMO_VERSION_NAME: ${{ github.event.inputs.versionName }}
          LUMO_VERSION_CODE: ${{ github.event.inputs.versionCode }}
          LUMO_KEY_ALIAS: ${{ secrets.LUMO_KEY_ALIAS }}
        run: bash scripts/android-setup.sh

      - name: Web-Dateien übernehmen
        run: npx cap sync android

      - name: AAB bauen
        env:
          LUMO_STORE_PASSWORD: ${{ secrets.LUMO_STORE_PASSWORD }}
          LUMO_KEY_ALIAS: ${{ secrets.LUMO_KEY_ALIAS }}
          LUMO_KEY_PASSWORD: ${{ secrets.LUMO_KEY_PASSWORD }}
        run: |
          chmod +x android/gradlew
          cd android && ./gradlew bundleRelease --no-daemon --stacktrace

      - name: APK zum Weitergeben bauen
        env:
          LUMO_STORE_PASSWORD: ${{ secrets.LUMO_STORE_PASSWORD }}
          LUMO_KEY_ALIAS: ${{ secrets.LUMO_KEY_ALIAS }}
          LUMO_KEY_PASSWORD: ${{ secrets.LUMO_KEY_PASSWORD }}
        run: cd android && ./gradlew assembleRelease --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: Lumo-Play-Paket
          path: |
            android/app/build/outputs/bundle/release/*.aab
            android/app/build/outputs/apk/release/*.apk
          if-no-files-found: error
